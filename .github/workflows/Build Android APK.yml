name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          validate-wrappers: false
          cache-provider: basic

      - name: Android SDK 35 kontrolü
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Debug APK derle
        run: gradle assembleDebug --stacktrace

      - name: APK adını düzenle
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/YagSatis-v1.0.0-debug.apk

      - name: APK'yı indirilebilir çıktı olarak yükle
        uses: actions/upload-artifact@v7
        with:
          name: YagSatis-Android-APK
          path: dist/YagSatis-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
