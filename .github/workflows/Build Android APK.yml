name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7

      - name: Java 17 kur
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Android API 35 ve Build Tools kur
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Proje yapisini dogrula
        shell: bash
        run: |
          test -f app/build.gradle || (echo "HATA: app/build.gradle bulunamadi" && exit 1)
          test -f settings.gradle || (echo "HATA: settings.gradle bulunamadi" && exit 1)
          test -f app/src/main/AndroidManifest.xml || (echo "HATA: AndroidManifest.xml bulunamadi" && exit 1)
          test -f app/src/main/java/com/yagsatis/mobile/AppDatabaseHelper.java || (echo "HATA: AppDatabaseHelper.java bulunamadi" && exit 1)
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher_logo.png || (echo "HATA: launcher logo bulunamadi" && exit 1)
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || (echo "HATA: adaptive launcher icon bulunamadi" && exit 1)

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          validate-wrappers: false
          cache-provider: basic

      - name: Web JS soz dizimini dogrula
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("HATA: script bulunamadi")
          Path("/tmp/yagsatis-app.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/yagsatis-app.js

      - name: Debug APK derle
        run: gradle :app:assembleDebug --stacktrace

      - name: APK adini duzenle
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/YagSatis-v1.2.2-debug.apk

      - name: APK'yi artifact olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: YagSatis-Android-APK
          path: dist/YagSatis-v1.2.2-debug.apk
          if-no-files-found: error
          retention-days: 30
